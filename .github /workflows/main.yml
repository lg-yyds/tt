name: Sync N3RD

on:
  schedule:
    - cron: '55 02 * * *'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write
  actions: write   # 用于删除旧的 workflow runs

jobs:
  clone:
    runs-on: ubuntu-latest

    steps:
      # 检出当前仓库
      - name: Checkout repository
        uses: actions/checkout@v3

      # 克隆目标仓库到临时目录（不污染工作区）
      - name: Clone n3rddd/N3RD repository
        run: |
          echo "Cloning n3rddd/N3RD repository..."
          git clone --depth 1 https://github.com/n3rddd/N3RD.git /tmp/N3RD
          echo "Clone completed."

      # 同步上游文件：覆盖/新增共有文件，保留本仓库独有文件
      - name: Sync files from upstream (keep local-only files)
        run: |
          echo "Syncing files from N3RD (overwrite existing + add new, keep local-only)..."
          rsync -av --exclude='.git' /tmp/N3RD/ ./
          echo "Sync completed."

      # 复制 JN/EXT/JS/YTTV.txt 到 JN/EXT/TXT 目录
      - name: Copy YTTV.txt to target directory
        run: |
          echo "Copying YTTV.txt to JN/EXT/TXT..."
          mkdir -p JN/EXT/TXT
          if [ -f JN/EXT/JS/YTTV.txt ]; then
            cp JN/EXT/JS/YTTV.txt JN/EXT/TXT/
            echo "YTTV.txt copied."
          else
            echo "YTTV.txt not found, skip."
          fi

      # 提交并推送更改到自己的仓库
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync from n3rddd/N3RD"
            git push origin ${{ github.ref_name }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 清理临时克隆
      - name: Clean up
        run: |
          echo "Cleaning up..."
          rm -rf /tmp/N3RD
          echo "Cleanup completed."

      # 只保留最新 3 条工作流运行记录
      - name: Keep only the latest 3 workflow runs
        run: |
          echo "Cleaning old workflow runs (keep latest 3)..."
          gh run list \
            --workflow="Sync N3RD" \
            --limit 50 \
            --json databaseId \
            --jq '.[3:][].databaseId' | while read -r id; do
              echo "Deleting run $id"
              gh run delete "$id" || true
            done
          echo "Cleanup of old runs completed."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
